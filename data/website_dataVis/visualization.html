<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>t-SNE Topic Evolution Visualization with Side Window and Iteration Count</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="tsne.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; }
        #visualization { position: relative; }
        svg { border: 1px solid #ccc; }
        .node text { font-size: 10px; }
        .links line { stroke-width: 1px; }
        .topic-links line { stroke: black; }
        #sideWindow {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 400px;
            height: 300px;
            background: white;
            border: 1px solid #ccc;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            display: none;
            z-index: 1000;
        }
        #sideWindow .content {
            display: flex;
            height: 100%;
        }
        #sideWindow .image {
            width: 40%;
            background: #f0f0f0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #sideWindow .text {
            width: 60%;
            padding: 10px;
            overflow-y: auto;
        }
        #closeButton {
            position: absolute;
            top: 5px;
            right: 5px;
            cursor: pointer;
        }
        #iterationCount {
            font-size: 14px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>t-SNE Topic Evolution Visualization with Side Window and Iteration Count</h1>
    <div id="visualization"></div>
    <div id="sideWindow">
        <div id="closeButton">✖</div>
        <div class="content">
            <div class="image"></div>
            <div class="text"></div>
        </div>
    </div>
    
    <!-- Add this button after the visualization div -->
    <button id="saveSvgButton">Save SVG</button>

    <!-- Add this after the Save SVG button -->
    <div id="dataButtons">
        <button onclick="loadData(0)">Data 0</button>
        <button onclick="loadData(1)">Data 1</button>
        <button onclick="loadData(2)">Data 2</button>
        <button onclick="loadData(3)">Data 3</button>
    </div>

    <script id="dataScript" src="data0.js"></script>

    <script>
        // Add this function before the DOMContentLoaded event listener
        function loadData(dataNum) {
            // Remove existing data script
            const oldScript = document.getElementById('dataScript');
            if (oldScript) {
                oldScript.remove();
            }

            // Clear the existing visualization
            document.getElementById('visualization').innerHTML = '';
            
            // Create and add new script
            const newScript = document.createElement('script');
            newScript.id = 'dataScript';
            newScript.src = `data${dataNum}.js`;
            newScript.onload = () => {
                // Reinitialize the visualization
                initializeVisualization();
            };
            document.body.appendChild(newScript);
        }

        // Move all the visualization code into a function
        function initializeVisualization() {
            if (typeof data === 'undefined') {
                console.error('Data not loaded. Make sure data.js is in the same directory and contains the data object.');
                return;
            }

            const runtime = data.runtime;
            const proposalNames = ['Alex', 'Sally', 'Taylor'];
            
            // Extract vectors and create nodes
            const nodes = runtime.flatMap((round, i) => [
                { 
                    id: `Topic_${i}`, 
                    label: `R${i}`, 
                    type: 'topic', 
                    round: i,
                    vector: round.topic.vector,
                    fullContent: round.topic.compressed_text
                },
                ...round.proposals.map((p, j) => ({ 
                    id: `Proposal_${i}_${j}`, 
                    label: proposalNames[j], 
                    type: 'proposal', 
                    round: i,
                    vector: p.vector,
                    fullContent: p.compressed_proposal
                }))
            ]);

            // Create links
            const links = [];
            for (let i = 0; i < runtime.length; i++) {
                if (i < runtime.length - 1) {
                    links.push({source: `Topic_${i}`, target: `Topic_${i+1}`, type: 'topic'});
                }
                runtime[i].proposals.forEach((_, j) => {
                    links.push({source: `Topic_${i}`, target: `Proposal_${i}_${j}`, type: 'proposal'});
                });
            }

            // Prepare data for t-SNE
            const vectors = nodes.map(d => d.vector);

            // Set up the SVG
            const width = 1200;
            const height = 800;
            const margin = {top: 20, right: 20, bottom: 20, left: 20};

            const svg = d3.select("#visualization").append("svg")
                .attr("width", width + margin.left + margin.right)
                .attr("height", height + margin.top + margin.bottom)
                .call(d3.zoom().on("zoom", zoomed))
              .append("g")
                .attr("transform", `translate(${margin.left},${margin.top})`);

            const container = svg.append("g");

            // Create scales
            const xScale = d3.scaleLinear().range([0, width]);
            const yScale = d3.scaleLinear().range([height, 0]);

            // Color nodes based on round
            const colorScale = d3.scaleOrdinal(d3.schemeCategory10);

            // Create the links
            const link = container.append("g")
                .attr("class", "links")
                .selectAll("line")
                .data(links)
                .enter().append("line")
                .attr("class", d => d.type + "-links");

            // Create the nodes
            const node = container.append("g")
                .attr("class", "nodes")
                .selectAll(".node")
                .data(nodes)
                .enter().append("g")
                .attr("class", "node")
                .on("click", showSideWindow)

            node.append("circle")
                .attr("r", d => d.type === 'topic' ? 10 : 5)
                .attr("fill", d => colorScale(d.round));

            node.append("text")
                .text(d => d.label)
                .attr('x', d => d.type === 'topic' ? -7 : 8)
                .attr('y', d => d.type === 'topic' ? 4 : 3)
                .attr('text-anchor', d => d.type === 'topic' ? 'middle' : 'start');

            // Add legend for rounds
            const legend = svg.selectAll(".legend")
                .data(d3.range(runtime.length))
                .enter().append("g")
                .attr("class", "legend")
                .attr("transform", (d, i) => `translate(0,${i * 20})`);

            legend.append("rect")
                .attr("x", width - 18)
                .attr("width", 18)
                .attr("height", 18)
                .style("fill", colorScale);

            legend.append("text")
                .attr("x", width - 24)
                .attr("y", 9)
                .attr("dy", ".35em")
                .style("text-anchor", "end")
                .text(d => `Round ${d}`);

            // Add iteration count text
            const iterationText = svg.append("text")
                .attr("id", "iterationCount")
                .attr("x", 10)
                .attr("y", 30)
                .text("Iteration: 0");

            // Perform t-SNE
            const opt = {epsilon: 0.1, perplexity: 8, dim: 2};
            const tsne = new tsnejs.tSNE(opt);
            tsne.initDataRaw(vectors);

            let iteration = 0;

            // Animation function
            function animate() {
                for (let k = 0; k < 10; k++) {
                    tsne.step();
                    iteration++;
                }
                
                const Y = tsne.getSolution();
                
                xScale.domain(d3.extent(Y, d => d[0]));
                yScale.domain(d3.extent(Y, d => d[1]));

                node.attr("transform", (d, i) => `translate(${xScale(Y[i][0])},${yScale(Y[i][1])})`);

                link
                    .attr("x1", d => xScale(Y[nodes.findIndex(n => n.id === d.source)][0]))
                    .attr("y1", d => yScale(Y[nodes.findIndex(n => n.id === d.source)][1]))
                    .attr("x2", d => xScale(Y[nodes.findIndex(n => n.id === d.target)][0]))
                    .attr("y2", d => yScale(Y[nodes.findIndex(n => n.id === d.target)][1]))
                    .style("stroke", d => {
                        if (d.type === 'topic') return 'black';
                        const sourceRound = parseInt(d.source.split('_')[1]);
                        return d3.color(colorScale(sourceRound)).copy({opacity: 0.5});
                    });

                // Update iteration count
                iterationText.text(`Iteration: ${iteration}`);

                requestAnimationFrame(animate);
            }

            // Zoom function
            function zoomed(event) {
                container.attr("transform", event.transform);
            }

            // Side window functions
            function showSideWindow(event, d) {
                const sideWindow = document.getElementById('sideWindow');
                const content = sideWindow.querySelector('.text');
                content.innerHTML = `<h3>${d.type === 'topic' ? `Round ${d.round} Topic` : `${d.label}'s Proposal (Round ${d.round})`}</h3>
                                     <p>${d.fullContent}</p>`;
                sideWindow.style.display = 'block';
            }

            function hideSideWindow() {
                const sideWindow = document.getElementById('sideWindow');
                sideWindow.style.display = 'none';
            }

            // Close button for side window
            document.getElementById('closeButton').addEventListener('click', hideSideWindow);

            // Add this function to handle SVG saving
            function saveSvg() {
                const svgElement = document.querySelector('svg');
                const svgData = new XMLSerializer().serializeToString(svgElement);
                const svgBlob = new Blob([svgData], {type: 'image/svg+xml;charset=utf-8'});
                const svgUrl = URL.createObjectURL(svgBlob);
                
                const downloadLink = document.createElement('a');
                downloadLink.href = svgUrl;
                downloadLink.download = 'visualization.svg';
                document.body.appendChild(downloadLink);
                downloadLink.click();
                document.body.removeChild(downloadLink);
            }

            // Add event listener for the save button
            document.getElementById('saveSvgButton').addEventListener('click', saveSvg);

            // Start the animation
            animate();
        }

        // Update the DOMContentLoaded event listener
        document.addEventListener('DOMContentLoaded', (event) => {
            initializeVisualization();
        });
    </script>
</body>
</html>
